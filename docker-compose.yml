version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: assurawy
      POSTGRES_PASSWORD: assurawy
      POSTGRES_DB: assurawy
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  app:
    build: .
    restart: unless-stopped
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://assurawy:assurawy@db:5432/assurawy?schema=public
      # REQUIRED: set a real JWT_SECRET in a `.env` file next to this compose
      # file (`openssl rand -base64 32`) before running in production - the
      # app now refuses to start with this placeholder value or if it's unset.
      JWT_SECRET: ${JWT_SECRET:-replace-with-a-long-random-string}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      NODE_ENV: production
    ports:
      - "3000:3000"
    volumes:
      # Persists locally-uploaded lesson PDFs/videos across container
      # restarts/rebuilds (only relevant if S3_* env vars aren't set - see
      # lib/storage.ts - since without this volume, public/uploads lives
      # only in the container's writable layer and is lost on recreation).
      - uploads_data:/app/public/uploads

volumes:
  db_data:
  uploads_data:
