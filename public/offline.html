<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>You're offline — Assurawy Islamic Media</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #F8F3E7;
      color: #16261F;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
      text-align: center;
      padding: 24px;
    }
    .card {
      max-width: 420px;
    }
    h1 {
      font-size: 1.5rem;
      color: #0E3B2E;
      margin-bottom: 8px;
    }
    p {
      color: #16261F99;
      line-height: 1.6;
    }
    .mark {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      background: #0E3B2E;
      margin: 0 auto 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #C6A15B;
      font-size: 1.5rem;
    }
    button {
      margin-top: 20px;
      background: #C6A15B;
      color: #0E3B2E;
      border: none;
      border-radius: 999px;
      padding: 12px 28px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="mark">✦</div>
    <h1>You're offline</h1>
    <p>
      This page needs an internet connection. Once you're back online,
      your progress and dashboard will pick up right where you left off.
    </p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
